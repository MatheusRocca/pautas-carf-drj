# Roda os testes a cada push e pull request. Python 3.9 é o do Mac (modo
# manual) e 3.12 é o do modo automático no GitHub (pautas.yml).

name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-24.04   # mesma versão do pautas.yml
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Roda os testes
        run: python -m unittest discover tests -v
